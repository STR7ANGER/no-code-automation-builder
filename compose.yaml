services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: automation
    ports: ["5460:5432"]
    volumes: ["automation-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation -d automation"]
      interval: 3s
      timeout: 3s
      retries: 20
  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: automation
      MONGO_INITDB_ROOT_PASSWORD: automation
    ports: ["27060:27017"]
    volumes: ["automation-mongo:/data/db"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["6400:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://automation:automation@postgres:5432/automation?schema=public
      MONGODB_URL: mongodb://automation:automation@mongodb:27017/executions?authSource=admin
      REDIS_URL: redis://redis:6379
    ports: ["3010:3010"]
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
  orchestrator:
    profiles: ["application"]
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports: ["3020:3020"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3010
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  automation-postgres:
  automation-mongo:
