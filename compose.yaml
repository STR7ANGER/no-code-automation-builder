services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: automation
    ports: ["5460:5432"]
    volumes: ["automation-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation -d automation"]
      interval: 3s
      timeout: 3s
      retries: 20
  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: automation
      MONGO_INITDB_ROOT_PASSWORD: automation
    ports: ["27060:27017"]
    volumes: ["automation-mongo:/data/db"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["6400:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  automation-postgres:
  automation-mongo:
